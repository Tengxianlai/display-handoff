name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\tests\Protocol.Tests.ps1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: bash tests/macos-smoke.sh
